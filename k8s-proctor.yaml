apiVersion: apps/v1
kind: Deployment
metadata:
  name: proctor-deployment
  labels:
    service: proctor
spec:
  replicas: 2
  selector:
    matchLabels:
      service: proctor
  template:
    metadata:
      labels:
        service: proctor
    spec:
      containers:
      - name: proctor
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: proctor-service
  labels:
    service: proctor
spec:
  type: NodePort
  selector:
    service: proctor
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30094
